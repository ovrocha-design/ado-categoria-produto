spring.application.name=ado-categoria-produto

# Banco H2 em memoria: URL de conexao e credenciais
spring.datasource.url=jdbc:h2:mem:adodb
spring.datasource.username=sa
spring.datasource.password=

# Console do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mostra no terminal o SQL que o JPA executa
spring.jpa.show-sql=true

# Chave secreta que assina os tokens JWT (em producao viria da variavel de ambiente JWT_SECRET)
api.security.token.secret=${JWT_SECRET:A_Minha_Senha_Ultra_Secreta_123}
